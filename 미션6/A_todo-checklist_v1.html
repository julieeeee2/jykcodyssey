<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할 일 체크리스트</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f8fa;color:#20242b;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:620px;margin:72px auto;padding:0 20px}
  h1{font-size:clamp(24px,5vw,30px);letter-spacing:-.8px;margin:0 0 28px}
  form{display:flex;gap:10px;margin-bottom:22px}
  input[type=text]{flex:1;min-width:0;border:1px solid #d6dbe2;border-radius:10px;background:white;padding:14px 15px;font:inherit;font-size:16px;outline-offset:2px}
  button{font:inherit;cursor:pointer}
  #add{background:#252c38;color:#fff;border:0;border-radius:10px;padding:0 21px;font-weight:600;white-space:nowrap}
  ul{list-style:none;margin:0;padding:0;background:white;border:1px solid #e2e5e9;border-radius:12px;overflow:hidden}
  li{display:flex;align-items:center;gap:12px;padding:14px 15px;min-height:58px}
  li+li{border-top:1px solid #edf0f2}
  li input[type=checkbox]{width:20px;height:20px;accent-color:#252c38;flex:none;cursor:pointer}
  .task{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.5}
  .task.done{text-decoration:line-through;color:#8b929c}
  .delete{border:0;background:transparent;color:#737b86;padding:8px;border-radius:7px;flex:none}
  .delete:hover,.delete:focus-visible{background:#f0f1f3;color:#242a33}
  #empty{margin:0;border:1px dashed #d9dee5;border-radius:12px;text-align:center;padding:36px 12px;color:#818995;background:#fff}
  @media(max-width:480px){main{margin:42px auto;padding:0 16px}form{gap:8px}#add{padding:0 16px}li{padding:12px}}
</style>
</head>
<body>
<main>
  <h1>오늘의 할 일 체크리스트</h1>
  <form id="form" autocomplete="off">
    <input id="newTask" type="text" aria-label="할 일 입력" placeholder="할 일을 입력하세요">
    <button id="add" type="submit">추가</button>
  </form>
  <p id="empty">할 일을 추가해 보세요</p>
  <ul id="tasks" aria-label="할 일 목록" hidden></ul>
</main>
<script>
(function(){
  'use strict';
  const KEY='today-checklist-items-v1';
  const form=document.getElementById('form');
  const field=document.getElementById('newTask');
  const list=document.getElementById('tasks');
  const empty=document.getElementById('empty');
  let items=[];
  try {
    const stored=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(stored)) items=stored.filter(x=>x && typeof x.text==='string' && typeof x.done==='boolean').map(x=>({text:x.text,done:x.done}));
  } catch(e) { items=[]; }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(items));}
    catch(e){console.warn('브라우저 저장을 사용할 수 없습니다.',e);}
  }
  function render(){
    list.replaceChildren();
    empty.hidden=items.length!==0;
    list.hidden=items.length===0;
    items.forEach((item,index)=>{
      const li=document.createElement('li');
      const check=document.createElement('input');
      check.type='checkbox';check.checked=item.done;
      check.setAttribute('aria-label',item.text+' 완료');
      check.addEventListener('change',()=>{items[index].done=check.checked;save();render();});
      const label=document.createElement('span');
      label.className='task'+(item.done?' done':'');
      label.textContent=item.text;
      const del=document.createElement('button');
      del.type='button';del.className='delete';del.textContent='삭제';
      del.setAttribute('aria-label',item.text+' 삭제');
      del.addEventListener('click',()=>{items.splice(index,1);save();render();});
      li.append(check,label,del);list.append(li);
    });
  }
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const text=field.value.trim();
    if(!text){field.focus();return;}
    items.push({text,done:false});save();render();field.value='';field.focus();
  });
  render();
})();
</script>
</body>
</html>
